name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot (patch/minor)
    runs-on: ubuntu-latest
    # user.login rather than github.actor: actor reflects whoever triggered the event,
    # so a maintainer pushing to or reopening a Dependabot branch would skip this job.
    # The repository check stops the job doing anything on a fork.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == 'cgtqwmwkhp-rgb/quality-governance-platform'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # This gate exists because the failure it guards against is SILENT.
      #
      # Auto-merge enabled with GITHUB_TOKEN works — the PR merges — but the resulting
      # push does not trigger workflows. CI runs on `push` to main and staging chains off
      # CI via workflow_run, so an auto-merged PR lands on main and is never built, never
      # deployed, and never reported as failed. main and production drift apart quietly.
      # That happened on 2026-08-04 with 78a2efe7 and had to be re-converged by hand.
      #
      # An App or PAT-authored merge does fire push, which is why the token below is not
      # optional. If the secret is absent we fail the job rather than fall back to
      # GITHUB_TOKEN, because falling back would silently recreate the drift.
      #
      # The token must be stored as a DEPENDABOT secret, not an Actions secret: workflow
      # runs triggered by Dependabot read from a separate store, and an Actions secret
      # would arrive empty here.
      - name: Require a non-GITHUB_TOKEN credential
        env:
          MERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MERGE_TOKEN:-}" ]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN is not set. Add it under Settings -> Secrets and variables -> Dependabot (NOT Actions). Refusing to fall back to GITHUB_TOKEN, because an auto-merge enabled with GITHUB_TOKEN lands on main without triggering CI or any deploy."
            exit 1
          fi
          echo "Merge credential present."

      # github_actions is excluded on purpose. A compromised action executes inside CI
      # holding this repository's credentials and can rewrite the very workflows meant to
      # catch it, and nothing in the required checks inspects what an action does.
      # A library at least has to survive the test suite, CodeQL and pip-audit. Those
      # bumps are few and are reviewed by a human.
      #
      # For a grouped PR, update-type reports the highest semver change in the group, so
      # a group containing a major cannot slip through labelled as minor.
      #
      # There is deliberately no approval step. Branch protection requires no reviews, so
      # an approval buys nothing, and granting Actions the right to approve pull requests
      # would silently satisfy any review requirement added later.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.package-ecosystem != 'github_actions'
          && (steps.metadata.outputs.update-type == 'version-update:semver-patch'
              || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

name: Azure Static Web Apps CI/CD

# =============================================================================
# WORKFLOW OVERVIEW
# =============================================================================
# This workflow deploys the frontend to Azure Static Web Apps with a staging-first
# discipline. Production promotion is GATED on staging_ui_verification success.
#
# PR Behavior:
#   - Build-only validation (no deployment) to satisfy branch protection
#   - Actual deployment only happens on push to main
#
# Push to Main Behavior:
#   1. deploy_to_staging: Build with STAGING API, deploy to the *named*
#      pre-production SWA environment (separate hostname)
#   2. staging_ui_verification: Run Playwright E2E against that separate hostname
#      (HARD GATE)
#   3. deploy_production_swa: Rebuild with PRODUCTION API, deploy to the default
#      (production) SWA environment behind PRODUCTION_SWA_HOST
#   4. production_isolation_audit: Assert the staging bake never touched
#      PRODUCTION_SWA_HOST
#
# =============================================================================
# ENVIRONMENT SPLIT — WHY TWO HOSTNAMES (PX-178 / PX-191)
# =============================================================================
# A single Azure Static Web App resource serves several *environments*, each on
# its own hostname:
#
#   default  (production)     https://purple-water-03205fa03.6.azurestaticapps.net
#   staging  (pre-production) https://purple-water-03205fa03-staging.6.azurestaticapps.net
#
# The named environment is selected with the `deployment_environment` input of
# Azure/static-web-apps-deploy. Omitting that input deploys to `default`, i.e.
# straight to the user-facing production hostname.
#
# THE DEFECT THIS PREVENTS (PX-178, P0):
#   This workflow previously omitted `deployment_environment` on the staging
#   upload, so the STAGING bake (baked against STAGING_API_URL) was published to
#   the SAME hostname that serves production. For the whole duration of the
#   Playwright gate — typically 10-20 minutes — real production users were served
#   a frontend wired to the staging API. deploy_production_swa only overwrote it
#   *afterwards*, and only if the gate passed. On a gate failure, or on any
#   workflow_dispatch validation run (which never runs deploy_production_swa),
#   the staging bake was left on the production hostname indefinitely until a
#   human ran the emergency recovery job.
#
# THE RULE, ENFORCED BELOW:
#   Exactly two jobs may write to the default/production environment, and both
#   build with PRODUCTION_API_URL:
#     - deploy_production_swa      (post-gate, push to main)
#     - emergency_production_bake  (manual recovery)
#   Every other deploying job MUST pass `deployment_environment` and therefore
#   cannot reach PRODUCTION_SWA_HOST.
#
# Full runbook, including recovery: docs/runbooks/SWA_ENVIRONMENT_ISOLATION.md
#
# =============================================================================
# VITE_API_URL RATIONALE (INTENTIONAL)
# =============================================================================
# Two bakes, two hostnames:
#   1. PR validation + deploy_to_staging → STAGING API
#      https://qgp-staging-plantexpand.azurewebsites.net
#      Lands on: the named pre-production environment ONLY (PR builds do not
#      deploy at all)
#   2. deploy_production_swa (post-gate, push to main only) → PRODUCTION API
#      https://app-qgp-prod.azurewebsites.net
#      Lands on: the default environment == PRODUCTION_SWA_HOST (tip==LIVE)
#
# Preview / PR builds never deploy and never bake production API.
# Validation mode (workflow_dispatch) NEVER runs deploy_production_swa — which is
# safe now precisely because it also never writes to the production hostname.
#
# =============================================================================
# SAFETY NETS RETAINED (do not remove)
# =============================================================================
#   - staging_ui_verification: hard Playwright gate before any production write.
#   - "Verify tip==LIVE production API bake": asserts the production dist inlines
#     PRODUCTION_API_URL and does not bake staging as VITE_API_URL.
#   - emergency_production_bake: manual recovery that re-publishes a production
#     bake to the production hostname.
#   - production_isolation_audit: fails the run if the staging upload was ever
#     observed on the production hostname. It runs *after* deploy_production_swa
#     deliberately, so detection never blocks self-healing.
#
# =============================================================================
# VALIDATION MODE (Manual Testing)
# =============================================================================
# Use workflow_dispatch with inputs to test classification paths:
#   - simulate_no_tests: true  -> NO_TESTS classification
#   - simulate_infra_failure: true -> INFRA_FAILURE classification
#
# CRITICAL: Validation mode NEVER runs deploy_production_swa.
# =============================================================================
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/vite.config.ts'
      - 'frontend/playwright.config.ts'
      - 'frontend/.env.example'
      - 'frontend/tests/e2e/**'
      - '.github/workflows/azure-static-web-apps-purple-water-03205fa03.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_no_tests:
        description: 'Simulate NO_TESTS classification (run with filter that matches nothing)'
        required: false
        type: boolean
        default: false
      simulate_infra_failure:
        description: 'Simulate INFRA_FAILURE classification (skip Playwright install)'
        required: false
        type: boolean
        default: false
      validation_mode:
        description: 'Enable validation mode (blocks production SWA bake/redeploy)'
        required: false
        type: boolean
        default: false
      force_production_bake:
        description: 'EMERGENCY: rebuild+deploy purple-water with PRODUCTION API + Entra VITE_* secrets (skips staging UI gate)'
        required: false
        type: boolean
        default: false

env:
  # --- Production (default SWA environment) --------------------------------
  # The one user-facing hostname. Only deploy_production_swa and
  # emergency_production_bake are permitted to publish here, and both bake
  # PRODUCTION_API_URL. PRODUCTION_SWA_HOST is the bare host used for
  # string-equality isolation checks.
  PRODUCTION_SWA_HOST: purple-water-03205fa03.6.azurestaticapps.net
  PRODUCTION_SWA_URL: https://purple-water-03205fa03.6.azurestaticapps.net

  # --- Pre-production (named SWA environment) ------------------------------
  # PX-178: the staging bake goes here, never to the default environment. The
  # name is passed to Azure/static-web-apps-deploy as `deployment_environment`.
  # Azure derives the hostname as <app-name>-<environment>.<region>.azurestaticapps.net,
  # which is what STAGING_SWA_URL_FALLBACK encodes. The authoritative URL is the
  # deploy action's `static_web_app_url` output; the fallback only covers the
  # case where the action returns an empty output.
  STAGING_SWA_ENVIRONMENT: staging
  STAGING_SWA_URL_FALLBACK: https://purple-water-03205fa03-staging.6.azurestaticapps.net

  # --- API backends --------------------------------------------------------
  STAGING_API_URL: https://qgp-staging-plantexpand.azurewebsites.net
  PRODUCTION_API_URL: https://app-qgp-prod.azurewebsites.net

jobs:
  # For PRs: build-only (no deployment) to satisfy branch protection.
  # PX-178: despite the legacy job name, this job contains no deploy step and
  # therefore targets no hostname at all. Keep it that way — a PR build bakes the
  # staging API.
  build_and_deploy_job:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Frontend (PR validation only — staging API bake)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.pull_request.updated_at }}
        run: npm run build
      - name: Skip deployment (PR)
        run: echo "Skipping SWA deployment for PR - will deploy on merge to main"

  # ============================================================================
  # STAGING DEPLOYMENT
  # Builds the STAGING API bake and publishes it to the NAMED pre-production SWA
  # environment (STAGING_SWA_ENVIRONMENT), which lives on its own hostname.
  # PX-178: this job must never be able to write to PRODUCTION_SWA_HOST.
  #
  # Skipped when force_production_bake is requested: an emergency recovery run
  # should do nothing except re-publish a production bake. Previously this job
  # ran alongside emergency_production_bake and raced it for the same hostname.
  # ============================================================================
  deploy_to_staging:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_production_bake != true)
    runs-on: ubuntu-latest
    name: Deploy to Staging (pre-production environment)
    outputs:
      deploy_sha: ${{ github.sha }}
      deploy_time: ${{ steps.set_version.outputs.build_time }}
      # Hostname the staging bake actually landed on. Consumed by
      # staging_ui_verification so the gate always tests what was just deployed.
      staging_url: ${{ steps.staging_url.outputs.url }}
      staging_host: ${{ steps.staging_url.outputs.host }}
      staging_url_source: ${{ steps.staging_url.outputs.source }}
      # 'true' only if the staging bake demonstrably did not reach production.
      isolation_ok: ${{ steps.isolation.outputs.isolation_ok }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Clean Install Dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci
      
      - name: Update Service Worker Cache Version
        working-directory: frontend
        run: |
          # Inject git SHA into service worker for cache busting
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/CACHE_VERSION = 'qgp-v[^']*'/CACHE_VERSION = 'qgp-v2.0.0-${SHA}-${TIMESTAMP}'/" public/sw.js
          echo "Updated SW cache version to: qgp-v2.0.0-${SHA}-${TIMESTAMP}"
      
      - name: Set build version metadata
        id: set_version
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "VITE_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VITE_BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
      
      - name: Build Frontend (staging API bake for verification)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_AUTHORITY: ${{ secrets.VITE_AZURE_AUTHORITY }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_BUILD_SHA: ${{ env.VITE_BUILD_SHA }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}
        run: |
          npm run build
      
      - name: Verify No HTTP API URLs in Build
        working-directory: frontend
        run: |
          node scripts/check-no-http-api.cjs
      
      - name: Deploy staging bake to the named pre-production SWA environment
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WATER_03205FA03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          skip_app_build: true
          # PX-178: THE line that keeps this bundle off the production hostname.
          # Without it the action targets the `default` environment, which is
          # PRODUCTION_SWA_HOST. Do not remove, and do not set production_branch
          # here — that would re-classify this upload as a production deployment.
          deployment_environment: ${{ env.STAGING_SWA_ENVIRONMENT }}

      # PX-178: establish, from the deploy we just performed, which hostname the
      # staging bake is on. Never fails the job: if isolation was somehow
      # violated we want the pipeline to continue to the production bake so it
      # self-heals, and production_isolation_audit turns the run red at the end.
      - name: Resolve pre-production hostname
        id: staging_url
        env:
          ACTION_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
          FALLBACK_URL: ${{ env.STAGING_SWA_URL_FALLBACK }}
          PRODUCTION_HOST: ${{ env.PRODUCTION_SWA_HOST }}
        run: |
          set -euo pipefail

          URL="${ACTION_URL:-}"
          SOURCE="action_output"
          if [ -z "$URL" ]; then
            URL="$FALLBACK_URL"
            SOURCE="fallback"
            echo "[WARN] Deploy action returned no static_web_app_url; using derived name."
          fi

          case "$URL" in
            https://*) ;;
            http://*)  URL="https://${URL#http://}" ;;
            *)         URL="https://${URL}" ;;
          esac
          URL="${URL%/}"
          HOST="${URL#https://}"
          HOST="${HOST%%/*}"

          {
            echo "url=$URL"
            echo "host=$HOST"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

          if [ "$HOST" = "$PRODUCTION_HOST" ]; then
            echo "separated=false" >> "$GITHUB_OUTPUT"
            echo "::error title=PX-178 environment split failed::Staging bake was published to the production hostname ${HOST}. Expected the named '${STAGING_SWA_ENVIRONMENT:-staging}' environment."
          else
            echo "separated=true" >> "$GITHUB_OUTPUT"
            echo "[OK] Staging bake is isolated on ${HOST} (production is ${PRODUCTION_HOST})."
          fi

      # PX-178 defence in depth: the check above trusts the deploy action. This
      # one asks the production hostname directly whether it is now serving a
      # staging-API bundle. Best-effort — it only inspects the entry chunks
      # referenced by index.html — and never fails the job on its own.
      - name: Probe production hostname for a staging bake
        id: prod_probe
        env:
          PROBE_BASE_URL: ${{ env.PRODUCTION_SWA_URL }}
          STAGING_API_URL: ${{ env.STAGING_API_URL }}
        run: |
          python3 <<'PY'
          import os
          import re
          import sys
          import urllib.request

          base = os.environ["PROBE_BASE_URL"].rstrip("/")
          staging = os.environ["STAGING_API_URL"]
          out = os.environ["GITHUB_OUTPUT"]

          def emit(value, note):
              print(note)
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"contaminated={value}\n")

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "px178-isolation-probe",
                      "Cache-Control": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read().decode("utf-8", errors="ignore")

          try:
              index = fetch(base + "/")
          except Exception as exc:  # network/DNS/5xx - inconclusive, not a failure
              emit("unknown", f"UNVERIFIED: could not fetch {base}/ ({exc})")
              sys.exit(0)

          assets = sorted(set(re.findall(r'(?:src|href)="(/assets/[^"]+\.js)"', index)))
          if not assets:
              emit("unknown", f"UNVERIFIED: no /assets/*.js entry chunks referenced by {base}/")
              sys.exit(0)

          # The production bundle legitimately contains the staging URL inside the
          # static API_URLS map in src/config/apiBase.ts. Only an occurrence
          # OUTSIDE that map means staging was baked in as VITE_API_URL.
          staging_map = re.compile(r'staging\s*:\s*[\'"]' + re.escape(staging) + r'[\'"]')

          contaminated = False
          checked = 0
          for path in assets[:10]:
              try:
                  text = fetch(base + path)
              except Exception as exc:
                  print(f"WARN: could not fetch {path} ({exc})")
                  continue
              checked += 1
              if staging in staging_map.sub("", text):
                  contaminated = True
                  print(f"DETECTED: staging API baked as VITE_API_URL in {base}{path}")

          if not checked:
              emit("unknown", "UNVERIFIED: no entry chunk could be downloaded")
          elif contaminated:
              emit("true", f"FAIL: {base} is serving a staging-API bundle")
          else:
              emit("false", f"OK: {base} is not serving a staging-API bundle ({checked} chunk(s) checked)")
          PY

      - name: Record PX-178 isolation status
        id: isolation
        env:
          SEPARATED: ${{ steps.staging_url.outputs.separated }}
          CONTAMINATED: ${{ steps.prod_probe.outputs.contaminated }}
          STAGING_HOST: ${{ steps.staging_url.outputs.host }}
          STAGING_URL: ${{ steps.staging_url.outputs.url }}
          URL_SOURCE: ${{ steps.staging_url.outputs.source }}
          PRODUCTION_HOST: ${{ env.PRODUCTION_SWA_HOST }}
        run: |
          set -euo pipefail

          if [ "$SEPARATED" = "true" ] && [ "$CONTAMINATED" != "true" ]; then
            ISOLATION_OK="true"
          else
            ISOLATION_OK="false"
          fi
          echo "isolation_ok=$ISOLATION_OK" >> "$GITHUB_OUTPUT"

          {
            echo "## PX-178 Hostname Isolation"
            echo ""
            echo "| Check | Value |"
            echo "|-------|-------|"
            echo "| Staging bake hostname | \`$STAGING_HOST\` |"
            echo "| Hostname source | \`$URL_SOURCE\` |"
            echo "| Production hostname | \`$PRODUCTION_HOST\` |"
            echo "| Hostnames separated | \`$SEPARATED\` |"
            echo "| Production serving staging bake | \`$CONTAMINATED\` |"
            echo "| **Isolation OK** | \`$ISOLATION_OK\` |"
            echo ""
            echo "Staging UI verification target: $STAGING_URL"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ISOLATION_OK" != "true" ]; then
            echo "::warning title=PX-178 isolation not confirmed::Continuing so the production bake can still run; production_isolation_audit will fail this run."
          fi

  # ============================================================================
  # STAGING UI VERIFICATION (HARD GATE)
  # Runs Playwright against the pre-production SWA environment deployed above.
  # CRITICAL: This job MUST pass for production promotion to proceed.
  # Also runs on workflow_dispatch for validation mode testing.
  #
  # PX-178: the target hostname is taken from deploy_to_staging rather than a
  # workflow-level constant, so the gate always exercises the bundle that was
  # just published and can never silently be pointed at production.
  # ============================================================================
  staging_ui_verification:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_production_bake != true)
    needs: deploy_to_staging
    runs-on: ubuntu-latest
    name: Staging UI Verification (GATE)
    env:
      STAGING_SWA_URL: ${{ needs.deploy_to_staging.outputs.staging_url }}
    outputs:
      test_status: ${{ steps.playwright_gate.outputs.test_status }}
      failure_type: ${{ steps.playwright_gate.outputs.failure_type }}
      exit_code: ${{ steps.playwright_gate.outputs.exit_code }}
      passed_count: ${{ steps.playwright_gate.outputs.passed_count }}
      failed_count: ${{ steps.playwright_gate.outputs.failed_count }}
      skipped_count: ${{ steps.playwright_gate.outputs.skipped_count }}
      total_count: ${{ steps.playwright_gate.outputs.total_count }}
      results_exist: ${{ steps.playwright_gate.outputs.results_exist }}
      junit_exist: ${{ steps.playwright_gate.outputs.junit_exist }}
    steps:
      # PX-178: fail fast rather than silently fall back to a default URL if the
      # upstream job did not hand us a hostname.
      - name: Confirm verification target
        run: |
          set -euo pipefail
          if [ -z "${STAGING_SWA_URL:-}" ]; then
            echo "[FAIL] deploy_to_staging did not report a pre-production hostname."
            exit 1
          fi
          echo "[OK] Verifying: $STAGING_SWA_URL"
          echo "Hostname source: ${{ needs.deploy_to_staging.outputs.staging_url_source }}"
          if [ "${{ needs.deploy_to_staging.outputs.isolation_ok }}" != "true" ]; then
            # Deliberately non-fatal: blocking here would also block the
            # production bake that repairs the production hostname.
            echo "::warning title=PX-178::Isolation was not confirmed for this run; see production_isolation_audit."
          fi
      
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright Browsers
        if: ${{ github.event.inputs.simulate_infra_failure != 'true' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      
      - name: Skip Playwright Install (INFRA_FAILURE Simulation)
        if: ${{ github.event.inputs.simulate_infra_failure == 'true' }}
        run: |
          echo "[WARN] VALIDATION MODE: Simulating INFRA_FAILURE by skipping Playwright install"
          echo "This will cause tests to fail with missing browser error."
      
      - name: Wait for SWA deployment to propagate
        run: |
          echo "Waiting 30s for SWA deployment to propagate..."
          sleep 30
      
      - name: Verify Staging SWA is accessible
        run: |
          echo "[CHECK] Verifying staging SWA is accessible..."
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.STAGING_SWA_URL }}/")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "[OK] Staging SWA is accessible (HTTP $HTTP_STATUS)"
              break
            fi
            echo "[WAIT] Attempt $i: HTTP $HTTP_STATUS, retrying in 10s..."
            sleep 10
          done
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "[FAIL] Staging SWA not accessible after 5 attempts"
            exit 1
          fi
      
      - name: Capture Staging Evidence - Header
        id: evidence
        run: |
          echo "# [TARGET] Staging UI Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Staging URL** (pre-production env) | ${{ env.STAGING_SWA_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production URL** (not touched here) | ${{ env.PRODUCTION_SWA_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy SHA** | \`${{ needs.deploy_to_staging.outputs.deploy_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy Time** | ${{ needs.deploy_to_staging.outputs.deploy_time }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Route Accessibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          ROUTES=(
            "/"
            "/investigations"
            "/audits"
            "/planet-mark"
          )
          
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.STAGING_SWA_URL }}${route}")
            if [ "$STATUS" = "200" ]; then
              echo "- [OK] \`${route}\`: HTTP $STATUS" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [FAIL] \`${route}\`: HTTP $STATUS" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Run Playwright E2E Tests against Staging
        id: playwright_run
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_SWA_URL }}
          CI: true
        run: |
          echo "[TEST] Running Playwright E2E tests against staging..."
          mkdir -p playwright-report
          
          # Validation mode handling
          SIMULATE_NO_TESTS="${{ github.event.inputs.simulate_no_tests }}"
          
          # Run tests with explicit reporters to ensure output files are created
          export PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-report/results.json
          export PLAYWRIGHT_JUNIT_OUTPUT_NAME=playwright-report/junit.xml
          set +e
          if [ "$SIMULATE_NO_TESTS" = "true" ]; then
            echo "[WARN] VALIDATION MODE: Simulating NO_TESTS by using filter that matches nothing"
            npx playwright test --grep="NONEXISTENT_TEST_PATTERN_12345" --reporter=list,json,junit 2>&1
          else
            # workers=1: parallel specs share the staging API IP and trip 429s,
            # which aborts mocked import-review hydration mid-flight.
            npx playwright test --workers=1 tests/e2e/staging-verification.spec.ts tests/e2e/import-reset-promote.spec.ts tests/e2e/inspection-capa-risk-cuj.spec.ts --reporter=list,json,junit 2>&1
          fi
          EXIT_CODE=$?
          set -e
          echo "playwright_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Playwright exit code: $EXIT_CODE"
          echo "[DEBUG] Contents of playwright-report/:"
          ls -la playwright-report/ 2>/dev/null || echo "  (directory not found)"
      
      # ========================================================================
      # VALIDATION MODE: Inject deterministic conditions for classification testing
      # This step ONLY runs on workflow_dispatch with validation inputs
      # It CANNOT affect normal push-to-main deployments
      # ========================================================================
      - name: Inject Validation Mode Conditions
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: |
          SIMULATE_NO_TESTS="${{ github.event.inputs.simulate_no_tests }}"
          SIMULATE_INFRA_FAILURE="${{ github.event.inputs.simulate_infra_failure }}"
          
          if [ "$SIMULATE_INFRA_FAILURE" = "true" ]; then
            echo "========================================"
            echo "VALIDATION MODE: Simulating INFRA_FAILURE"
            echo "========================================"
            echo "Removing results.json and junit.xml to trigger INFRA_FAILURE classification"
            rm -f playwright-report/results.json
            rm -f playwright-report/junit.xml
            echo "Files removed. INFRA_FAILURE classification should trigger."
          fi
          
          if [ "$SIMULATE_NO_TESTS" = "true" ]; then
            echo "========================================"
            echo "VALIDATION MODE: Simulating NO_TESTS"
            echo "========================================"
            echo "Injecting empty results to trigger NO_TESTS classification"
            # Create a valid results.json with zero tests
            cat > playwright-report/results.json << 'EOFRESULTS'
          {
            "config": {},
            "suites": [],
            "stats": {
              "expected": 0,
              "unexpected": 0,
              "skipped": 0,
              "flaky": 0
            }
          }
          EOFRESULTS
            # Create a valid empty junit.xml
            cat > playwright-report/junit.xml << 'EOFJUNIT'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="" tests="0" failures="0" errors="0" time="0">
          </testsuites>
          EOFJUNIT
            echo "Empty results injected. NO_TESTS classification should trigger."
          fi
      
      - name: Parse Playwright Results (Audit-Grade Deterministic)
        id: playwright_gate
        working-directory: frontend
        run: |
          # ============================================================================
          # AUDIT-GRADE DETERMINISTIC GATE PARSING
          # 
          # PASSED requires ALL of:
          #   1. results.json exists
          #   2. junit.xml exists
          #   3. TOTAL > 0 (at least one test executed)
          #   4. FAILED == 0
          #   5. PLAYWRIGHT_EXIT_CODE == 0
          #
          # Failure Classifications (mutually exclusive, in priority order):
          #   - NO_TESTS: Results exist but TOTAL == 0 (no tests executed)
          #   - INFRA_FAILURE: Missing results OR exit code != 0 OR missing junit
          #   - TEST_FAILURE: FAILED > 0 (tests ran but assertions failed)
          #
          # This ensures the gate status is NEVER ambiguous.
          # ============================================================================
          
          PLAYWRIGHT_EXIT_CODE="${{ steps.playwright_run.outputs.playwright_exit_code }}"
          RESULTS_FILE="playwright-report/results.json"
          JUNIT_FILE="playwright-report/junit.xml"
          
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if result files exist
          RESULTS_EXIST="false"
          JUNIT_EXIST="false"
          [ -f "$RESULTS_FILE" ] && RESULTS_EXIST="true"
          [ -f "$JUNIT_FILE" ] && JUNIT_EXIST="true"
          
          echo "### Preconditions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Required |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| results.json exists | $( [ "$RESULTS_EXIST" = "true" ] && echo "[OK]" || echo "[FAIL]" ) | Yes |" >> $GITHUB_STEP_SUMMARY
          echo "| junit.xml exists | $( [ "$JUNIT_EXIST" = "true" ] && echo "[OK]" || echo "[FAIL]" ) | Yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit Code == 0 | $( [ "$PLAYWRIGHT_EXIT_CODE" = "0" ] && echo "[OK]" || echo "[FAIL] ($PLAYWRIGHT_EXIT_CODE)" ) | Yes |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Initialize outputs
          echo "exit_code=$PLAYWRIGHT_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "results_exist=$RESULTS_EXIST" >> $GITHUB_OUTPUT
          echo "junit_exist=$JUNIT_EXIST" >> $GITHUB_OUTPUT
          
          # Parse results if available
          if [ "$RESULTS_EXIST" = "true" ]; then
            PASSED=$(jq -r '.stats.expected // 0' "$RESULTS_FILE")
            FAILED=$(jq -r '.stats.unexpected // 0' "$RESULTS_FILE")
            SKIPPED=$(jq -r '.stats.skipped // 0' "$RESULTS_FILE")
            FLAKY=$(jq -r '.stats.flaky // 0' "$RESULTS_FILE")
            
            # Ensure numeric values (handle null/empty)
            PASSED=${PASSED:-0}
            FAILED=${FAILED:-0}
            SKIPPED=${SKIPPED:-0}
            FLAKY=${FLAKY:-0}
            
            # Validate numeric
            [[ "$PASSED" =~ ^[0-9]+$ ]] || PASSED=0
            [[ "$FAILED" =~ ^[0-9]+$ ]] || FAILED=0
            [[ "$SKIPPED" =~ ^[0-9]+$ ]] || SKIPPED=0
            [[ "$FLAKY" =~ ^[0-9]+$ ]] || FLAKY=0
            
            TOTAL=$((PASSED + FAILED + SKIPPED + FLAKY))
            
            echo "### Test Counts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| Flaky | $FLAKY |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Set count outputs
            echo "passed_count=$PASSED" >> $GITHUB_OUTPUT
            echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped_count=$SKIPPED" >> $GITHUB_OUTPUT
            echo "flaky_count=$FLAKY" >> $GITHUB_OUTPUT
            echo "total_count=$TOTAL" >> $GITHUB_OUTPUT
            
            # ================================================================
            # CLASSIFICATION LOGIC (Priority Order)
            # ================================================================
            
            # 1. NO_TESTS: Results exist but no tests executed
            if [ "$TOTAL" -eq 0 ]; then
              echo "test_status=no_tests" >> $GITHUB_OUTPUT
              echo "failure_type=NO_TESTS" >> $GITHUB_OUTPUT
              echo "### [FAIL] GATE STATUS: NO_TESTS" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **No tests executed (TOTAL == 0).** Production promotion is BLOCKED." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Failure Type:** NO_TESTS" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Possible causes:" >> $GITHUB_STEP_SUMMARY
              echo "- Test filter excluded all tests" >> $GITHUB_STEP_SUMMARY
              echo "- Test files not found by Playwright" >> $GITHUB_STEP_SUMMARY
              echo "- Configuration issue in playwright.config.ts" >> $GITHUB_STEP_SUMMARY
            
            # 2. TEST_FAILURE: Tests ran but some failed
            elif [ "$FAILED" -gt 0 ]; then
              echo "test_status=test_failure" >> $GITHUB_OUTPUT
              echo "failure_type=TEST_FAILURE" >> $GITHUB_OUTPUT
              echo "### [FAIL] GATE STATUS: TEST_FAILURE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **$FAILED test(s) failed.** Production promotion is BLOCKED." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Failure Type:** TEST_FAILURE (tests ran but assertions failed)" >> $GITHUB_STEP_SUMMARY
            
            # 3. INFRA_FAILURE: Missing junit.xml OR non-zero exit code
            elif [ "$JUNIT_EXIST" != "true" ] || [ "$PLAYWRIGHT_EXIT_CODE" != "0" ]; then
              echo "test_status=infra_failure" >> $GITHUB_OUTPUT
              echo "failure_type=INFRA_FAILURE" >> $GITHUB_OUTPUT
              echo "### [FAIL] GATE STATUS: INFRA_FAILURE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              if [ "$JUNIT_EXIST" != "true" ]; then
                echo "> **junit.xml missing.** Production promotion is BLOCKED." >> $GITHUB_STEP_SUMMARY
              else
                echo "> **Playwright exit code != 0 ($PLAYWRIGHT_EXIT_CODE).** Production promotion is BLOCKED." >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Failure Type:** INFRA_FAILURE" >> $GITHUB_STEP_SUMMARY
            
            # 4. PASSED: All conditions met
            else
              echo "test_status=passed" >> $GITHUB_OUTPUT
              echo "failure_type=NONE" >> $GITHUB_OUTPUT
              echo "### [OK] GATE STATUS: PASSED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> All $PASSED test(s) passed. Production promotion is ALLOWED." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**All preconditions met:**" >> $GITHUB_STEP_SUMMARY
              echo "- results.json exists: [OK]" >> $GITHUB_STEP_SUMMARY
              echo "- junit.xml exists: [OK]" >> $GITHUB_STEP_SUMMARY
              echo "- TOTAL > 0: [OK] ($TOTAL)" >> $GITHUB_STEP_SUMMARY
              echo "- FAILED == 0: [OK]" >> $GITHUB_STEP_SUMMARY
              echo "- EXIT_CODE == 0: [OK]" >> $GITHUB_STEP_SUMMARY
            fi
          else
            # No results file - INFRA_FAILURE
            echo "passed_count=0" >> $GITHUB_OUTPUT
            echo "failed_count=0" >> $GITHUB_OUTPUT
            echo "skipped_count=0" >> $GITHUB_OUTPUT
            echo "flaky_count=0" >> $GITHUB_OUTPUT
            echo "total_count=0" >> $GITHUB_OUTPUT
            echo "test_status=infra_failure" >> $GITHUB_OUTPUT
            echo "failure_type=INFRA_FAILURE" >> $GITHUB_OUTPUT
            
            echo "### [FAIL] GATE STATUS: INFRA_FAILURE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **No test results found (results.json missing).** Production promotion is BLOCKED." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Failure Type:** INFRA_FAILURE (runner/config crash - tests did not complete)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Playwright Exit Code:** $PLAYWRIGHT_EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Possible causes:" >> $GITHUB_STEP_SUMMARY
            echo "- Playwright failed to start (missing dependencies)" >> $GITHUB_STEP_SUMMARY
            echo "- Configuration error in playwright.config.ts" >> $GITHUB_STEP_SUMMARY
            echo "- Network failure reaching staging SWA" >> $GITHUB_STEP_SUMMARY
            echo "- Out of memory or timeout" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Playwright HTML Report (Audit Artifact)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-staging
          path: frontend/playwright-report/
          retention-days: 90
      
      - name: Upload Playwright JUnit Report (Machine-Readable)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-junit-staging
          path: frontend/playwright-report/junit.xml
          retention-days: 90
          if-no-files-found: warn
      
      - name: Upload Playwright JSON Report (Machine-Readable)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-json-staging
          path: frontend/playwright-report/results.json
          retention-days: 90
          if-no-files-found: warn
      
      - name: Upload Playwright Test Results (Screenshots/Videos)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results-staging
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-traces-staging
          path: frontend/test-results/**/*.zip
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Generate Evidence Summary Footer
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Audit Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Description | Retention | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`playwright-report-staging\` | HTML report with test details | 90 days | Always |" >> $GITHUB_STEP_SUMMARY
          echo "| \`playwright-junit-staging\` | Machine-readable JUnit XML | 90 days | ${{ steps.playwright_gate.outputs.junit_exist == 'true' && '[OK]' || '[WARN]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| \`playwright-json-staging\` | Machine-readable JSON results | 90 days | ${{ steps.playwright_gate.outputs.results_exist == 'true' && '[OK]' || '[WARN]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| \`playwright-test-results-staging\` | Screenshots and videos | 30 days | On failure |" >> $GITHUB_STEP_SUMMARY
          echo "| \`playwright-traces-staging\` | Traces for debugging | 30 days | On failure |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## [GATE] Production Gating (Audit-Grade)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Status** | \`${{ steps.playwright_gate.outputs.test_status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failure Type** | \`${{ steps.playwright_gate.outputs.failure_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Exit Code** | ${{ steps.playwright_gate.outputs.exit_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Passed** | ${{ steps.playwright_gate.outputs.passed_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed** | ${{ steps.playwright_gate.outputs.failed_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Skipped** | ${{ steps.playwright_gate.outputs.skipped_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | ${{ steps.playwright_gate.outputs.total_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **results.json** | ${{ steps.playwright_gate.outputs.results_exist }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **junit.xml** | ${{ steps.playwright_gate.outputs.junit_exist }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PASSED Requires ALL:" >> $GITHUB_STEP_SUMMARY
          echo "- results.json exists" >> $GITHUB_STEP_SUMMARY
          echo "- junit.xml exists" >> $GITHUB_STEP_SUMMARY
          echo "- TOTAL > 0" >> $GITHUB_STEP_SUMMARY
          echo "- FAILED == 0" >> $GITHUB_STEP_SUMMARY
          echo "- EXIT_CODE == 0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production promotion gated on staging_ui_verification: YES**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Staging UI Verification completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)_" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail job if tests failed (HARD GATE)
        if: steps.playwright_gate.outputs.test_status != 'passed'
        run: |
          echo "============================================================"
          echo "[FAIL] STAGING UI VERIFICATION FAILED"
          echo "============================================================"
          echo ""
          echo "Gate Status: ${{ steps.playwright_gate.outputs.test_status }}"
          echo "Failure Type: ${{ steps.playwright_gate.outputs.failure_type }}"
          echo ""
          echo "Preconditions:"
          echo "  results.json exists: ${{ steps.playwright_gate.outputs.results_exist }}"
          echo "  junit.xml exists: ${{ steps.playwright_gate.outputs.junit_exist }}"
          echo "  Exit Code: ${{ steps.playwright_gate.outputs.exit_code }}"
          echo ""
          echo "Test Counts:"
          echo "  Passed: ${{ steps.playwright_gate.outputs.passed_count }}"
          echo "  Failed: ${{ steps.playwright_gate.outputs.failed_count }}"
          echo "  Skipped: ${{ steps.playwright_gate.outputs.skipped_count }}"
          echo "  Total: ${{ steps.playwright_gate.outputs.total_count }}"
          echo ""
          echo "============================================================"
          echo "Production promotion is BLOCKED."
          echo "============================================================"
          exit 1

  # ============================================================================
  # PRODUCTION SWA BAKE + DEPLOY (tip==LIVE)
  # Rebuilds the frontend with the PRODUCTION API URL and publishes it to the
  # DEFAULT SWA environment == PRODUCTION_SWA_HOST.
  # Only runs if BOTH deploy_to_staging AND staging_ui_verification succeed.
  # SECURITY: workflow_dispatch (validation mode) NEVER runs this job.
  #
  # PX-178: this is one of only two jobs allowed to write to the production
  # hostname, and it is the only one on the automated path. Since the staging
  # bake now lands elsewhere, this job is no longer a *repair* of the production
  # hostname — it is the sole thing that ever changes it.
  # ============================================================================
  deploy_production_swa:
    if: github.event_name == 'push'
    needs: [deploy_to_staging, staging_ui_verification]
    runs-on: ubuntu-latest
    name: Deploy Production SWA (prod API bake)
    steps:
      - name: Verify Staging UI Verification Passed
        run: |
          echo "# [DEPLOY] Production SWA Bake (tip==LIVE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Gate Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Staging | [OK] PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging UI Verification | [OK] PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Verification Results (Audit-Grade)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Status** | \`${{ needs.staging_ui_verification.outputs.test_status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failure Type** | \`${{ needs.staging_ui_verification.outputs.failure_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit Code | ${{ needs.staging_ui_verification.outputs.exit_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Passed | ${{ needs.staging_ui_verification.outputs.passed_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Failed | ${{ needs.staging_ui_verification.outputs.failed_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Skipped | ${{ needs.staging_ui_verification.outputs.skipped_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Total | ${{ needs.staging_ui_verification.outputs.total_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy SHA | \`${{ needs.deploy_to_staging.outputs.deploy_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| results.json | ${{ needs.staging_ui_verification.outputs.results_exist == 'true' && '[OK]' || '[WARN]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| junit.xml | ${{ needs.staging_ui_verification.outputs.junit_exist == 'true' && '[OK]' || '[WARN]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **Production API** | \`${{ env.PRODUCTION_API_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production SWA** | \`${{ env.PRODUCTION_SWA_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Clean Install Dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci

      - name: Update Service Worker Cache Version
        working-directory: frontend
        run: |
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/CACHE_VERSION = 'qgp-v[^']*'/CACHE_VERSION = 'qgp-v2.0.0-${SHA}-${TIMESTAMP}'/" public/sw.js
          echo "Updated SW cache version to: qgp-v2.0.0-${SHA}-${TIMESTAMP}"

      - name: Set production build version metadata
        id: set_version
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "VITE_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VITE_BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Build Frontend (PRODUCTION API bake)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.PRODUCTION_API_URL }}
          VITE_ENVIRONMENT: production
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_AUTHORITY: ${{ secrets.VITE_AZURE_AUTHORITY }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_BUILD_SHA: ${{ env.VITE_BUILD_SHA }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}
        run: |
          npm run build

      - name: Verify No HTTP API URLs in Build
        working-directory: frontend
        run: |
          node scripts/check-no-http-api.cjs

      - name: Verify tip==LIVE production API bake
        working-directory: frontend
        env:
          PRODUCTION_API_URL: ${{ env.PRODUCTION_API_URL }}
          STAGING_API_URL: ${{ env.STAGING_API_URL }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          prod = os.environ["PRODUCTION_API_URL"]
          staging = os.environ["STAGING_API_URL"]
          dist = pathlib.Path("dist")
          if not dist.exists():
              print("FAIL: dist/ missing")
              sys.exit(1)

          # API_URLS map may still mention staging; VITE_API_URL must not be inlined as staging.
          staging_map = re.compile(
              r'staging\s*:\s*[\'"]' + re.escape(staging) + r'[\'"]'
          )
          found_prod = False
          baked_staging = False
          for path in dist.rglob("*.js"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if prod in text:
                  found_prod = True
              cleaned = staging_map.sub("", text)
              if staging in cleaned:
                  baked_staging = True
                  print(f"FAIL: staging API appears outside API_URLS map in {path}")

          if baked_staging:
              sys.exit(1)
          if not found_prod:
              print(f"FAIL: production API URL not found in dist: {prod}")
              sys.exit(1)
          print(f"OK: production bake inlines {prod} and does not bake staging as VITE_API_URL")
          PY

      - name: Deploy production bake to purple-water SWA (default environment)
        id: proddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WATER_03205FA03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          skip_app_build: true
          # PX-178: `deployment_environment` is intentionally ABSENT so this
          # upload targets the default environment (PRODUCTION_SWA_HOST). This
          # is the only automated job permitted to do so, and the step above has
          # already proven the artifact bakes PRODUCTION_API_URL.

      - name: Production SWA bake summary
        if: always()
        run: |
          echo "## [OK] PRODUCTION SWA BAKE DEPLOYED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "tip==LIVE: purple-water now bakes \`${{ env.PRODUCTION_API_URL }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SWA | ${{ env.PRODUCTION_SWA_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VITE_API_URL | ${{ env.PRODUCTION_API_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build time | ${{ steps.set_version.outputs.build_time }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production SWA redeploy gated on staging_ui_verification: YES**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Production bake completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)_" >> $GITHUB_STEP_SUMMARY

  # NOTE: close_pull_request_job removed - no longer creating PR preview environments
  # Frontend PRs are validated by CI workflow (Build Check job) and only deployed on merge to main

  # ============================================================================
  # EMERGENCY PRODUCTION BAKE (workflow_dispatch only)
  # Restores tip==LIVE on PRODUCTION_SWA_HOST. Always includes Entra VITE_* secrets.
  #
  # PX-178: retained as a safety net. With the environment split in place the
  # original trigger for this job — a staging bake stranded on the production
  # hostname by a failed gate — should no longer occur, but this remains the
  # recovery path for any bad production bake (including one flagged by
  # production_isolation_audit). deploy_to_staging is skipped when this runs, so
  # nothing else is publishing concurrently.
  # ============================================================================
  emergency_production_bake:
    if: github.event_name == 'workflow_dispatch' && inputs.force_production_bake == true
    runs-on: ubuntu-latest
    name: Emergency Production SWA Bake
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Clean Install Dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci

      - name: Update Service Worker Cache Version
        working-directory: frontend
        run: |
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/CACHE_VERSION = 'qgp-v[^']*'/CACHE_VERSION = 'qgp-v2.0.0-${SHA}-${TIMESTAMP}'/" public/sw.js

      - name: Set production build version metadata
        run: |
          echo "VITE_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build Frontend (PRODUCTION API + Entra)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.PRODUCTION_API_URL }}
          VITE_ENVIRONMENT: production
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_AUTHORITY: ${{ secrets.VITE_AZURE_AUTHORITY }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_BUILD_SHA: ${{ env.VITE_BUILD_SHA }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}
        run: |
          test -n "$VITE_AZURE_CLIENT_ID" || { echo "FAIL: VITE_AZURE_CLIENT_ID secret empty"; exit 1; }
          test -n "$VITE_AZURE_AUTHORITY" || { echo "FAIL: VITE_AZURE_AUTHORITY secret empty"; exit 1; }
          npm run build

      - name: Verify tip==LIVE production API bake
        working-directory: frontend
        env:
          PRODUCTION_API_URL: ${{ env.PRODUCTION_API_URL }}
          STAGING_API_URL: ${{ env.STAGING_API_URL }}
        run: |
          python3 <<'PY'
          import os, pathlib, re, sys
          prod = os.environ["PRODUCTION_API_URL"]
          staging = os.environ["STAGING_API_URL"]
          dist = pathlib.Path("dist")
          staging_map = re.compile(r'staging\s*:\s*[\'"]' + re.escape(staging) + r'[\'"]')
          found_prod = baked_staging = False
          for path in dist.rglob("*.js"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if prod in text:
                  found_prod = True
              if staging in staging_map.sub("", text):
                  baked_staging = True
                  print(f"FAIL: staging API outside map in {path}")
          if baked_staging or not found_prod:
              sys.exit(1)
          print(f"OK: emergency production bake inlines {prod}")
          PY

      - name: Deploy production bake to purple-water SWA (default environment)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WATER_03205FA03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          skip_app_build: true
          # PX-178: `deployment_environment` intentionally ABSENT — recovery must
          # reach the default environment (PRODUCTION_SWA_HOST). This is the
          # second and last job permitted to write there.

  # ============================================================================
  # PRODUCTION HOSTNAME ISOLATION AUDIT (PX-178)
  # Turns the run red if the staging bake was ever observed on the production
  # hostname.
  #
  # Ordering is deliberate. This job depends on deploy_production_swa with
  # always(), so it reports *after* the production bake has had its chance to
  # overwrite any bad content. Failing earlier would starve deploy_production_swa
  # of its `needs` and strand a staging bundle on the production hostname —
  # exactly the outcome PX-178 is about.
  #
  # Only runs when deploy_to_staging actually succeeded; on any other path there
  # is no staging upload to audit.
  # ============================================================================
  production_isolation_audit:
    if: always() && needs.deploy_to_staging.result == 'success'
    needs: [deploy_to_staging, staging_ui_verification, deploy_production_swa]
    runs-on: ubuntu-latest
    name: Production Hostname Isolation Audit
    steps:
      - name: Assert the staging bake never reached the production hostname
        env:
          ISOLATION_OK: ${{ needs.deploy_to_staging.outputs.isolation_ok }}
          STAGING_HOST: ${{ needs.deploy_to_staging.outputs.staging_host }}
          URL_SOURCE: ${{ needs.deploy_to_staging.outputs.staging_url_source }}
          GATE_RESULT: ${{ needs.staging_ui_verification.result }}
          PROD_DEPLOY_RESULT: ${{ needs.deploy_production_swa.result }}
        run: |
          set -euo pipefail

          {
            echo "# PX-178 Production Hostname Isolation Audit"
            echo ""
            echo "| Job | Target hostname | Result |"
            echo "|-----|-----------------|--------|"
            echo "| deploy_to_staging | \`$STAGING_HOST\` (source: $URL_SOURCE) | success |"
            echo "| staging_ui_verification | \`$STAGING_HOST\` | $GATE_RESULT |"
            echo "| deploy_production_swa | \`$PRODUCTION_SWA_HOST\` | $PROD_DEPLOY_RESULT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ISOLATION_OK" = "true" ]; then
            echo "**Result: PASS** — the staging bake stayed off \`$PRODUCTION_SWA_HOST\`." >> "$GITHUB_STEP_SUMMARY"
            echo "[OK] Isolation confirmed."
            exit 0
          fi

          {
            echo "**Result: FAIL** — isolation could not be confirmed for this run."
            echo ""
            echo "Either the staging upload resolved to \`$PRODUCTION_SWA_HOST\`, or that"
            echo "hostname was observed serving a bundle baked against the staging API."
            echo ""
            echo "Recovery: re-run this workflow via workflow_dispatch with"
            echo "\`force_production_bake=true\` to republish a production bake, then"
            echo "confirm \`deployment_environment\` is still set on the staging upload."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=PX-178 isolation audit failed::Staging bake may have reached ${PRODUCTION_SWA_HOST}. See job summary for recovery steps."
          exit 1

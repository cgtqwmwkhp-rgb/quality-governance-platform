name: UX Functional Coverage Gate

on:
  workflow_run:
    workflows: ["Deploy to Azure Staging"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      app_url:
        description: 'API base URL to mint tokens against and audit'
        required: false
        default: ''
      frontend_url:
        description: 'Pre-production frontend URL (verified before use; production is refused)'
        required: false
        default: ''

concurrency:
  group: ux-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

  # PX-179: FRONTEND_URL is NOT set here. It used to be pinned to the production
  # Static Web App hostname, which meant Playwright (baseURL = FRONTEND_URL ||
  # APP_URL) drove the *production* frontend using tokens minted against
  # *staging* — so a governance gate generated synthetic traffic and login
  # attempts against a live production system, and anything needing real data
  # failed against a stack the credentials did not belong to. The target is now
  # resolved and verified per run by the resolve-frontend job, which refuses the
  # production hostname on every path.
  SWA_PRODUCTION_HOST: purple-water-03205fa03.6.azurestaticapps.net
  SWA_STAGING_ENVIRONMENT: staging
  # Named environments on this Static Web App carry a region segment
  # (…-<env>.westeurope.6.azurestaticapps.net); the pattern documented in the
  # SWA workflow omits it. Both forms are offered as candidates and neither is
  # trusted until it answers and proves it serves the staging bake.
  SWA_REGION: westeurope
  STAGING_API_URL: https://qgp-staging-plantexpand.azurewebsites.net
  PRODUCTION_API_URL: https://app-qgp-prod.azurewebsites.net

jobs:
  # Only run if staging deployment succeeded
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      use_custom_url: ${{ steps.check.outputs.use_custom_url }}
      custom_url: ${{ steps.check.outputs.custom_url }}
    steps:
      - name: Check trigger conditions
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_APP_URL: ${{ github.event.inputs.app_url }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            {
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
            # Check if custom URL was provided
            if [ -n "${DISPATCH_APP_URL}" ]; then
              {
                echo "use_custom_url=true"
                echo "custom_url=${DISPATCH_APP_URL}"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "use_custom_url=false"
                echo "custom_url="
              } >> "$GITHUB_OUTPUT"
            fi
          elif [ "${WORKFLOW_CONCLUSION}" = "success" ]; then
            {
              echo "should_run=true"
              echo "use_custom_url=false"
              echo "custom_url="
            } >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping: staging deployment did not succeed"
          fi

  # Establish which frontend this run is allowed to drive. Fails the job — and
  # therefore blocks every audit — rather than defaulting to a hostname the test
  # credentials do not belong to.
  resolve-frontend:
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      frontend_url: ${{ steps.resolve.outputs.frontend_url }}
      frontend_url_source: ${{ steps.resolve.outputs.frontend_url_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve pre-production frontend
        id: resolve
        env:
          UX_FRONTEND_URL: ${{ github.event.inputs.frontend_url || vars.UX_FRONTEND_URL }}
        run: node scripts/governance/resolve-ux-frontend-url.cjs

      - name: Record resolved target
        env:
          RESOLVED_URL: ${{ steps.resolve.outputs.frontend_url }}
          RESOLVED_SOURCE: ${{ steps.resolve.outputs.frontend_url_source }}
        run: |
          {
            echo "### UX coverage target"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Frontend | ${RESOLVED_URL} |"
            echo "| Resolved by | ${RESOLVED_SOURCE} |"
            echo "| API (tokens minted here) | ${STAGING_API_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Acquire auth tokens for testing
  acquire-tokens:
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      tokens_acquired: ${{ steps.tokens.outputs.tokens_acquired }}
      token_failure_reason: ${{ steps.tokens.outputs.token_failure_reason }}
      staging_reachable: ${{ steps.tokens.outputs.token_failure_reason != 'STAGING_UNREACHABLE_TIMEOUT' && steps.tokens.outputs.token_failure_reason != 'STAGING_UNREACHABLE_MAX_ATTEMPTS' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Acquire test tokens
        id: tokens
        continue-on-error: true  # Allow downstream jobs to run even if staging unreachable
        env:
          APP_URL: ${{ needs.check-trigger.outputs.use_custom_url == 'true' && needs.check-trigger.outputs.custom_url || format('https://{0}.azurewebsites.net', secrets.AZURE_WEBAPP_NAME) }}
          UX_TEST_USER_EMAIL: ${{ secrets.UX_TEST_USER_EMAIL }}
          UX_TEST_USER_PASSWORD: ${{ secrets.UX_TEST_USER_PASSWORD }}
          CI_TEST_SECRET: ${{ secrets.CI_TEST_SECRET }}
          TOKEN_FILE_PATH: ${{ github.workspace }}/tokens.env
        run: node scripts/governance/get-ux-test-tokens.cjs
      
      - name: Upload token file
        if: steps.tokens.outputs.tokens_acquired == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: auth-tokens
          path: tokens.env
          retention-days: 1
          if-no-files-found: ignore

  # Page Load Audit
  page-audit:
    runs-on: ubuntu-latest
    needs: [check-trigger, resolve-frontend, acquire-tokens]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/ux-coverage/package.json

      - name: Install dependencies
        working-directory: tests/ux-coverage
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Download auth tokens
        if: needs.acquire-tokens.outputs.tokens_acquired == 'true'
        uses: actions/download-artifact@v8
        with:
          name: auth-tokens
          path: .
        continue-on-error: true

      - name: Load and mask tokens
        id: load-tokens
        run: |
          if [ -f "tokens.env" ]; then
            . "tokens.env"
            echo "::add-mask::${ADMIN_TEST_TOKEN}"
            echo "::add-mask::${PORTAL_TEST_TOKEN}"
            echo "ADMIN_TEST_TOKEN=${ADMIN_TEST_TOKEN}" >> "$GITHUB_ENV"
            echo "PORTAL_TEST_TOKEN=${PORTAL_TEST_TOKEN}" >> "$GITHUB_ENV"
            echo "tokens_loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "tokens_loaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Page Audit
        working-directory: tests/ux-coverage
        env:
          FRONTEND_URL: ${{ needs.resolve-frontend.outputs.frontend_url }}
          APP_URL: ${{ needs.check-trigger.outputs.use_custom_url == 'true' && needs.check-trigger.outputs.custom_url || format('https://{0}.azurewebsites.net', secrets.AZURE_WEBAPP_NAME) }}
        run: npx playwright test tests/page-audit.spec.ts --reporter=list
        continue-on-error: true

      - name: Upload Page Audit Results
        uses: actions/upload-artifact@v7
        with:
          name: page-audit-results
          path: tests/ux-coverage/results/page_audit.json
          retention-days: 30

  # Link Audit
  link-audit:
    runs-on: ubuntu-latest
    needs: [check-trigger, resolve-frontend, acquire-tokens]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/ux-coverage/package.json

      - name: Install dependencies
        working-directory: tests/ux-coverage
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Download auth tokens
        if: needs.acquire-tokens.outputs.tokens_acquired == 'true'
        uses: actions/download-artifact@v8
        with:
          name: auth-tokens
          path: .
        continue-on-error: true

      - name: Load and mask tokens
        run: |
          if [ -f "tokens.env" ]; then
            . "tokens.env"
            echo "::add-mask::${ADMIN_TEST_TOKEN}"
            echo "::add-mask::${PORTAL_TEST_TOKEN}"
            echo "ADMIN_TEST_TOKEN=${ADMIN_TEST_TOKEN}" >> "$GITHUB_ENV"
            echo "PORTAL_TEST_TOKEN=${PORTAL_TEST_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Run Link Audit
        working-directory: tests/ux-coverage
        env:
          FRONTEND_URL: ${{ needs.resolve-frontend.outputs.frontend_url }}
          APP_URL: ${{ needs.check-trigger.outputs.use_custom_url == 'true' && needs.check-trigger.outputs.custom_url || format('https://{0}.azurewebsites.net', secrets.AZURE_WEBAPP_NAME) }}
        run: npx playwright test tests/link-audit.spec.ts --reporter=list
        continue-on-error: true

      - name: Upload Link Audit Results
        uses: actions/upload-artifact@v7
        with:
          name: link-audit-results
          path: tests/ux-coverage/results/link_audit.json
          retention-days: 30

  # Button Wiring Audit
  button-audit:
    runs-on: ubuntu-latest
    needs: [check-trigger, resolve-frontend, acquire-tokens]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/ux-coverage/package.json

      - name: Install dependencies
        working-directory: tests/ux-coverage
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Download auth tokens
        if: needs.acquire-tokens.outputs.tokens_acquired == 'true'
        uses: actions/download-artifact@v8
        with:
          name: auth-tokens
          path: .
        continue-on-error: true

      - name: Load and mask tokens
        run: |
          if [ -f "tokens.env" ]; then
            . "tokens.env"
            echo "::add-mask::${ADMIN_TEST_TOKEN}"
            echo "::add-mask::${PORTAL_TEST_TOKEN}"
            echo "ADMIN_TEST_TOKEN=${ADMIN_TEST_TOKEN}" >> "$GITHUB_ENV"
            echo "PORTAL_TEST_TOKEN=${PORTAL_TEST_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Run Button Audit
        working-directory: tests/ux-coverage
        env:
          FRONTEND_URL: ${{ needs.resolve-frontend.outputs.frontend_url }}
          APP_URL: ${{ needs.check-trigger.outputs.use_custom_url == 'true' && needs.check-trigger.outputs.custom_url || format('https://{0}.azurewebsites.net', secrets.AZURE_WEBAPP_NAME) }}
        run: npx playwright test tests/button-audit.spec.ts --reporter=list
        continue-on-error: true

      - name: Upload Button Audit Results
        uses: actions/upload-artifact@v7
        with:
          name: button-audit-results
          path: tests/ux-coverage/results/button_audit.json
          retention-days: 30

  # Workflow Audit (P0 Critical Paths)
  workflow-audit:
    runs-on: ubuntu-latest
    needs: [check-trigger, resolve-frontend, acquire-tokens]
    if: needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/ux-coverage/package.json

      - name: Install dependencies
        working-directory: tests/ux-coverage
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Download auth tokens
        if: needs.acquire-tokens.outputs.tokens_acquired == 'true'
        uses: actions/download-artifact@v8
        with:
          name: auth-tokens
          path: .
        continue-on-error: true

      - name: Load and mask tokens
        run: |
          if [ -f "tokens.env" ]; then
            . "tokens.env"
            echo "::add-mask::${ADMIN_TEST_TOKEN}"
            echo "::add-mask::${PORTAL_TEST_TOKEN}"
            echo "ADMIN_TEST_TOKEN=${ADMIN_TEST_TOKEN}" >> "$GITHUB_ENV"
            echo "PORTAL_TEST_TOKEN=${PORTAL_TEST_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Run Workflow Audit
        working-directory: tests/ux-coverage
        env:
          FRONTEND_URL: ${{ needs.resolve-frontend.outputs.frontend_url }}
          APP_URL: ${{ needs.check-trigger.outputs.use_custom_url == 'true' && needs.check-trigger.outputs.custom_url || format('https://{0}.azurewebsites.net', secrets.AZURE_WEBAPP_NAME) }}
          TEST_USER_EMAIL: ${{ secrets.UX_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.UX_TEST_USER_PASSWORD }}
        run: npx playwright test tests/workflow-audit.spec.ts --reporter=list
        continue-on-error: true

      - name: Upload Workflow Audit Results
        uses: actions/upload-artifact@v7
        with:
          name: workflow-audit-results
          path: tests/ux-coverage/results/workflow_audit.json
          retention-days: 30

  # Aggregate Results and Enforce Gate
  aggregate-and-gate:
    runs-on: ubuntu-latest
    needs: [check-trigger, resolve-frontend, acquire-tokens, page-audit, link-audit, button-audit, workflow-audit]
    if: always() && needs.check-trigger.outputs.should_run == 'true'
    steps:
      # Without a verified target the audits never ran, so there is nothing to
      # aggregate. Say that plainly instead of failing later on absent artifacts.
      - name: Require a resolved frontend target
        if: needs.resolve-frontend.result != 'success'
        run: |
          echo "::error title=UX coverage gate::No verified pre-production frontend was resolved, so no audit ran. See the 'resolve-frontend' job for the hostnames tried."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all audit results
        uses: actions/download-artifact@v8
        with:
          path: audit-results

      - name: Prepare results directory
        run: |
          mkdir -p tests/ux-coverage/results
          cp audit-results/page-audit-results/page_audit.json tests/ux-coverage/results/ 2>/dev/null || echo '{"results":[]}' > tests/ux-coverage/results/page_audit.json
          cp audit-results/link-audit-results/link_audit.json tests/ux-coverage/results/ 2>/dev/null || echo '{"results":[],"dead_end_map":[]}' > tests/ux-coverage/results/link_audit.json
          cp audit-results/button-audit-results/button_audit.json tests/ux-coverage/results/ 2>/dev/null || echo '{"results":[]}' > tests/ux-coverage/results/button_audit.json
          cp audit-results/workflow-audit-results/workflow_audit.json tests/ux-coverage/results/ 2>/dev/null || echo '{"results":[],"dead_ends":[]}' > tests/ux-coverage/results/workflow_audit.json

      - name: Run Aggregation
        id: aggregate
        run: |
          mkdir -p artifacts
          node scripts/governance/ux-coverage-aggregate.cjs || echo "aggregate_failed=true" >> "$GITHUB_OUTPUT"
        env:
          RESULTS_DIR: tests/ux-coverage/results
          OUTPUT_DIR: artifacts

      - name: Upload UX Coverage Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ux-coverage-report
          path: |
            artifacts/ux_coverage.json
            artifacts/ux_coverage.md
            artifacts/ux_dead_end_map.md
          retention-days: 30

      - name: Read Coverage Summary
        id: coverage
        run: |
          if [ -f "artifacts/ux_coverage.json" ]; then
            SCORE="$(jq -r '.score' "artifacts/ux_coverage.json")"
            STATUS="$(jq -r '.status' "artifacts/ux_coverage.json")"
            P0_FAILS="$(jq -r '.summary.p0_failures' "artifacts/ux_coverage.json")"
            P1_FAILS="$(jq -r '.summary.p1_failures' "artifacts/ux_coverage.json")"
            DEAD_ENDS="$(jq -r '.summary.dead_ends_count' "artifacts/ux_coverage.json")"
            P0_EXECUTED="$(jq -r '.p0_coverage.executed' "artifacts/ux_coverage.json")"
            P0_EXPECTED="$(jq -r '.p0_coverage.expected' "artifacts/ux_coverage.json")"
            P0_PASSED="$(jq -r '.p0_coverage.passed' "artifacts/ux_coverage.json")"
            P0_WAIVED="$(jq -r '.p0_coverage.waived' "artifacts/ux_coverage.json")"
            COVERAGE_COMPLETE="$(jq -r '.coverage_complete' "artifacts/ux_coverage.json")"
            # Flattened to one line: GITHUB_OUTPUT is newline-delimited.
            HOLD_REASONS="$(jq -r '.hold_reasons | join("; ")' "artifacts/ux_coverage.json" | tr -d '\n\r')"
            {
              echo "score=${SCORE}"
              echo "status=${STATUS}"
              echo "p0_fails=${P0_FAILS}"
              echo "p1_fails=${P1_FAILS}"
              echo "dead_ends=${DEAD_ENDS}"
              echo "p0_executed=${P0_EXECUTED}"
              echo "p0_expected=${P0_EXPECTED}"
              echo "p0_passed=${P0_PASSED}"
              echo "p0_waived=${P0_WAIVED}"
              echo "coverage_complete=${COVERAGE_COMPLETE}"
              echo "hold_reasons=${HOLD_REASONS}"
            } >> "$GITHUB_OUTPUT"
          else
            # No report at all is the most complete absence of evidence there is.
            {
              echo "score=0"
              echo "status=HOLD"
              echo "p0_fails=-1"
              echo "p1_fails=-1"
              echo "dead_ends=-1"
              echo "p0_executed=0"
              echo "p0_expected=0"
              echo "p0_passed=0"
              echo "p0_waived=0"
              echo "coverage_complete=false"
              echo "hold_reasons=The aggregator produced no coverage report."
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Summary
        env:
          COVERAGE_SCORE: ${{ steps.coverage.outputs.score }}
          COVERAGE_STATUS: ${{ steps.coverage.outputs.status }}
          COVERAGE_P0_FAILS: ${{ steps.coverage.outputs.p0_fails }}
          COVERAGE_P1_FAILS: ${{ steps.coverage.outputs.p1_fails }}
          COVERAGE_DEAD_ENDS: ${{ steps.coverage.outputs.dead_ends }}
          COVERAGE_P0_EXECUTED: ${{ steps.coverage.outputs.p0_executed }}
          COVERAGE_P0_EXPECTED: ${{ steps.coverage.outputs.p0_expected }}
          COVERAGE_P0_PASSED: ${{ steps.coverage.outputs.p0_passed }}
          COVERAGE_P0_WAIVED: ${{ steps.coverage.outputs.p0_waived }}
          COVERAGE_COMPLETE: ${{ steps.coverage.outputs.coverage_complete }}
          COVERAGE_HOLD_REASONS: ${{ steps.coverage.outputs.hold_reasons }}
          FRONTEND_TARGET: ${{ needs.resolve-frontend.outputs.frontend_url }}
          TOKENS_ACQUIRED: ${{ needs.acquire-tokens.outputs.tokens_acquired }}
        run: |
          {
            echo "## UX Functional Coverage Gate"
            echo
            echo "Execution and pass rates are reported separately: a pass rate over"
            echo "a handful of executed entries is not coverage."
            echo
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| P0 executed | ${COVERAGE_P0_EXECUTED} / ${COVERAGE_P0_EXPECTED} |"
            echo "| P0 passed | ${COVERAGE_P0_PASSED} / ${COVERAGE_P0_EXECUTED} |"
            echo "| P0 waived | ${COVERAGE_P0_WAIVED} |"
            echo "| P0 coverage complete | ${COVERAGE_COMPLETE} |"
            echo "| Score | ${COVERAGE_SCORE}/100 |"
            echo "| Status | ${COVERAGE_STATUS} |"
            echo "| P0 Failures | ${COVERAGE_P0_FAILS} |"
            echo "| P1 Failures | ${COVERAGE_P1_FAILS} |"
            echo "| Dead Ends | ${COVERAGE_DEAD_ENDS} |"
            echo "| Frontend tested | ${FRONTEND_TARGET} |"
            echo "| Tokens Acquired | ${TOKENS_ACQUIRED} |"
            echo
            if [ -n "${COVERAGE_HOLD_REASONS}" ] && [ "${COVERAGE_STATUS}" = "HOLD" ]; then
              echo "**Why this run is held:** ${COVERAGE_HOLD_REASONS}"
              echo
            fi
            if [ "${COVERAGE_STATUS}" = "GO" ]; then
              echo "PASS: Ready for production"
            elif [ "${COVERAGE_STATUS}" = "CANARY" ]; then
              echo "CANARY: Ready for canary deployment only"
            elif [ "${COVERAGE_STATUS}" = "STAGING" ]; then
              echo "STAGING: Ready for staging only"
            else
              echo "HOLD: Deployment blocked"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Gate (Fail on P0)
        if: steps.coverage.outputs.p0_fails != '0'
        run: |
          echo "❌ Gate FAILED: ${{ steps.coverage.outputs.p0_fails }} P0 failures detected"
          echo "See ux_coverage.md artifact for details"
          exit 1

      # A run that did not exercise its P0 coverage proved nothing. It is not a
      # score problem, so it does not borrow the score message.
      - name: Enforce Gate (Fail on unexecuted P0 coverage)
        if: steps.coverage.outputs.p0_fails == '0' && steps.coverage.outputs.coverage_complete != 'true'
        env:
          HOLD_REASONS: ${{ steps.coverage.outputs.hold_reasons }}
          P0_EXECUTED: ${{ steps.coverage.outputs.p0_executed }}
          P0_EXPECTED: ${{ steps.coverage.outputs.p0_expected }}
        run: |
          echo "❌ Gate FAILED: P0 coverage was not exercised"
          echo "   P0 executed: ${P0_EXECUTED}/${P0_EXPECTED}"
          echo "   ${HOLD_REASONS}"
          echo "See ux_coverage.md for the entries that did not execute"
          exit 1

      - name: Enforce Gate (Fail on HOLD)
        if: steps.coverage.outputs.status == 'HOLD' && steps.coverage.outputs.p0_fails == '0' && steps.coverage.outputs.coverage_complete == 'true'
        run: |
          echo "⚠️ Gate HOLD: Score ${{ steps.coverage.outputs.score }} below threshold"
          echo "See ux_coverage.md artifact for details"
          exit 1
